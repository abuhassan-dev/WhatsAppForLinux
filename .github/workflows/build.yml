name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          find src scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      # --publish never is required: electron-builder detects CI and otherwise
      # tries to publish to GitHub by itself, failing on a token it was never
      # given. Releases are this workflow's job, in the step below.
      - name: Package
        run: npx electron-builder --linux AppImage deb rpm --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-packages
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          draft: false
          generate_release_notes: true
